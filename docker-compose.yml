services:
  budcam-api:
    image: wizzer/budcam-api
    container_name: budcam-api
    restart: unless-stopped
    environment:
      BUDCAM_DATABASE_URL: sqlite:////app/data/budcam.db
      BUDCAM_TOKEN_EXPIRE_MINUTES: ${BUDCAM_TOKEN_EXPIRE_MINUTES:-120}
      BUDCAM_ZLM_API_BASE: http://127.0.0.1:9911
      BUDCAM_ZLM_SECRET: budcam
      BUDCAM_PUBLIC_ZLM_HOST: ${PUBLIC_HOST:-127.0.0.1}
      BUDCAM_PUBLIC_ZLM_HTTP_PORT: ${ZLM_HTTP_PORT:-9911}
      BUDCAM_PUBLIC_ZLM_WS_PORT: ${ZLM_HTTP_PORT:-9911}
      BUDCAM_RECORDING_PATH: /record
      BUDCAM_RECORD_RETENTION_DAYS: ${RECORD_RETENTION_DAYS:-0}
      BUDCAM_ONVIF_SCAN_TARGETS: ${ONVIF_SCAN_TARGETS:-192.168.1.0/24,192.168.2.0/24}
    volumes:
      - ./data:/app/data
      - ${RECORD_PATH:-./record}:/record
    ports:
      - "${PYTHON_PORT:-9910}:9910"
    depends_on:
      - zlmediakit

  budcam-web:
    image: wizzer/budcam-web
    container_name: budcam-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9900}:9900"
    depends_on:
      - budcam-api

  zlmediakit:
    image: zlmediakit/zlmediakit:master
    container_name: budcam-zlmediakit
    restart: unless-stopped
    environment:
      RECORD_PATH: /record
    volumes:
      - ./docker/zlmediakit/config.ini:/opt/media/conf/config.ini:ro
      - ${RECORD_PATH:-./record}:/record
    ports:
      - "${ZLM_HTTP_PORT:-9911}:9911"
      - "${ZLM_RTSP_PORT:-9554}:9554"
      - "${ZLM_RTMP_PORT:-9935}:9935"
      - "10000-10050:10000-10050/udp"
