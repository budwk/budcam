[api]
apiDebug=0
secret=budcam

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
resetWhenRePlay=1

[http]
port=9911
charSet=utf-8
keepAliveSecond=30
allow_cross_domains=1

[rtsp]
port=9554

[rtmp]
port=9935

[hls]
fileBufSize=65536
filePath=/opt/media/bin/www
segDur=2
segNum=3

[hook]
enable=1
timeoutSec=10
retry=1
retry_delay=3.0
on_play=http://budcam-api:9910/api/hooks/zlm/on_play
on_record_mp4=http://budcam-api:9910/api/hooks/zlm/on_record_mp4

[record]
appName=record
filePath=/record
fileRepeat=0
fileSecond=1800
sampleMS=500
