[api]
apiDebug=0
secret=

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
resetWhenRePlay=1

[http]
port=9911
charSet=utf-8
keepAliveSecond=30
allow_cross_domains=1

[rtsp]
port=9554

[rtmp]
port=9935

[hls]
fileBufSize=65536
filePath=/opt/media/bin/www
segDur=2
segNum=3

[hook]
enable=1
timeoutSec=10
retry=1
retry_delay=3.0
on_play=http://127.0.0.1:9910/api/hooks/zlm/on_play
on_record_mp4=http://127.0.0.1:9910/api/hooks/zlm/on_record_mp4

[protocol]
modify_stamp=2
enable_audio=1
add_mute_audio=1
auto_close=0
paced_sender_ms=0
enable_hls=1
enable_hls_fmp4=0
enable_mp4=1
mp4_as_player=1
enable_rtsp=1
enable_rtmp=1
enable_ts=1
enable_fmp4=1
mp4_as_player=0
mp4_max_second=3600
mp4_save_path=./www
hls_save_path=./www

[record]
appName=record
filePath=/record
enableFmp4=0
fileRepeat=0
fileSecond=1800
sampleMS=500
