server {
  listen 9900;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:9910/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy ZLMediaKit HTTP-FLV / WS-FLV streams through nginx
  # so only port 9900 needs to be exposed externally
    location /zlm/ {
        proxy_pass http://127.0.0.1:9911/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流媒体必需配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # 建议添加，防止长连接断开

        # 可选：添加 CORS 支持
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' '*' always;
    }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

